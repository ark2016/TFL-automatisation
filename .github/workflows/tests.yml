name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Allow manual trigger from the Actions tab
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Tests only need to read the repository.
permissions:
  contents: read

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install project + test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Lint (ruff, non-blocking)
        continue-on-error: true
        run: ruff check .

      - name: Run pytest suites for all four pipelines + TFL Lab server
        env:
          # A real key is never needed — tests use mocks only, and the root
          # conftest.py also strips this var and blocks live anthropic.*
          # calls for the whole session as a safety net.
          ANTHROPIC_API_KEY: sk-ant-ci-placeholder-not-used
        run: |
          python -m pytest \
            agent_system/tests \
            cfl_system/tests \
            dcfl_system/tests \
            ll_system/tests \
            ui_server/tests \
            tests \
            -q --color=yes -m "not slow" \
            -n auto --dist loadfile \
            --cov=agent_system --cov=cfl_system --cov=dcfl_system \
            --cov=ll_system --cov=ui_server --cov-report=term-missing

  pytest-slow:
    name: pytest (slow, marked)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install project + test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      # Exhaustive/brute-force checks (dcfl_system/tests/test_grammar_aSSb_dpda.py::
      # TestDpdaAcceptsMatchesGrammarOracle, which simulates every word up to
      # length 8 through cfl_system.lib.pda_simulator's general BFS
      # simulator) marked @pytest.mark.slow: kept for coverage, but split
      # into their own job (running in parallel with the `pytest` job
      # above, not nested inside it) so their real, non-redundant
      # simulation cost never risks the main job's timeout.
      - name: Run pytest suites marked slow
        env:
          ANTHROPIC_API_KEY: sk-ant-ci-placeholder-not-used
        run: |
          python -m pytest \
            agent_system/tests \
            cfl_system/tests \
            dcfl_system/tests \
            ll_system/tests \
            ui_server/tests \
            tests \
            -q --color=yes -m "slow" \
            -n auto --dist loadfile

  build:
    name: build wheel + smoke import
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir dist/

      - name: Install wheel and smoke-import every pipeline
        run: |
          pip install dist/*.whl
          python -c "
          import agent_system.orchestrator
          import cfl_system.orchestrator
          import dcfl_system.orchestrator
          import ll_system.orchestrator
          import ui_server.server
          import tfl_eval.cli
          print('smoke import OK')
          "
