name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Allow manual trigger from the Actions tab
  workflow_dispatch:

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install project + test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest

      - name: Run pytest suites for all four pipelines
        env:
          # A real key is never needed — tests use mocks only. Placeholder keeps
          # any accidental anthropic.Anthropic() constructor from erroring on init.
          ANTHROPIC_API_KEY: sk-ant-ci-placeholder-not-used
        run: |
          python -m pytest \
            agent_system/tests \
            cfl_system/tests \
            dcfl_system/tests \
            ll_system/tests \
            -q --color=yes
