[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tfl-automatisation"
version = "1.0.0"
description = "Multi-agent LLM pipelines for Theory of Formal Languages problems (regularity, CFL, DCFL, LL(k)) with a local web UI"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.13.0,<2",
    "httpx2>=2.0",
    "python-dotenv>=1.0.0",
    "langgraph>=1.0.0",
    "langchain-core>=0.3.0",
]

[project.optional-dependencies]
mcp = ["mcp>=1.0.0"]
viz = ["graphviz>=0.20"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "pytest-xdist>=3.5", "ruff>=0.6"]
# tfl_deep_agent (one deepagents agent next to the four pipelines). Tests under
# tfl_deep_agent/tests skip cleanly when this extra is not installed.
deep = [
    "deepagents==0.7.34",
    "langchain>=1.4,<2",
    "langchain-anthropic>=1.7.10,<2",
    "langgraph-checkpoint-sqlite>=3.1",
    "pypdf>=6.0",
]
all = ["tfl-automatisation[mcp,viz]"]

[project.scripts]
pumping-lemma = "pumping_lemma.cli:main"
tfl-reg = "agent_system.orchestrator:main"
tfl-cfl = "cfl_system.orchestrator:main"
tfl-dcfl = "dcfl_system.orchestrator:main"
tfl-ll = "ll_system.orchestrator:main"
tfl-lab = "ui_server.server:main"
tfl-eval = "tfl_eval.cli:main"
tfl-deep = "tfl_deep_agent.cli:main"

[tool.setuptools.packages.find]
include = [
    "pumping_lemma*",
    "reverse_morfism*",
    "agent_system*",
    "cfl_system*",
    "dcfl_system*",
    "ll_system*",
    "ui_server*",
    "tfl_eval*",
    "tfl_deep_agent*",
]
exclude = [
    "*.tests",
    "*.tests.*",
    "tests",
    "tests.*",
]

[tool.setuptools.package-data]
agent_system = ["prompts/*.md", "examples/**/*.json", "templates/**/*.lean", "templates/**/*"]
cfl_system = ["prompts/*.md", "examples/**/*.json"]
dcfl_system = ["prompts/*.md", "examples/**/*.json"]
ll_system = ["prompts/*.md", "examples/**/*.json"]
ui_server = ["static/**/*"]
tfl_eval = ["manifest.json"]
tfl_deep_agent = [
    "prompts/*.md",
    "skills/**/*",
    "templates/**/*",
    "examples/**/*",
    "settings.example.json",
    "sandbox/Dockerfile.sandbox",
    "sandbox/build.ps1",
]

[tool.pytest.ini_options]
testpaths = [
    "agent_system/tests",
    "cfl_system/tests",
    "dcfl_system/tests",
    "ll_system/tests",
    "ui_server/tests",
    "tests",
    "tfl_eval/tests",
    "tfl_deep_agent/tests",
]
markers = [
    "slow: exhaustive/brute-force simulations kept for coverage but run in a separate CI job (see .github/workflows/tests.yml)",
]
